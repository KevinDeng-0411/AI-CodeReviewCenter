[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeaware"
version = "0.1.0"
description = "CodeAware - AI 驱动的研发效能平台 (Java -> Python 重构)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "redis>=5.0",
    "unstructured>=0.16",
    "markdown>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "e2e_*.py"]
addopts = "-m 'not integration'"
markers = [
    "integration: 真实外部 API(Ollama/DeepSeek)测试，默认跳过；-m integration 单独跑",
]

[tool.ruff]
line-length = 100
