services:
  # ============================================================
  # PostgreSQL 16 + pgvector — 关系数据 + 向量存储
  # ============================================================
  postgres:
    image: codeaware/pgvector-pgsearch:pg16-v0.12.0
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile.bm25
    command: postgres -c shared_preload_libraries=pg_search
    container_name: ${CODEAWARE_POSTGRES_CONTAINER_NAME:-ai-center-postgres}
    restart: unless-stopped
    ports:
      - "${CODEAWARE_PG_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ai_center
      POSTGRES_USER: aicenter
      POSTGRES_PASSWORD: aicenter123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./java-legacy/ai-center-server/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-java-schema.sql:ro
      - ./docker/postgres/init/02-create-python-db.sql:/docker-entrypoint-initdb.d/02-create-python-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicenter -d ai_center"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis 7 — 缓存 + 短期记忆
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ${CODEAWARE_REDIS_CONTAINER_NAME:-ai-center-redis}
    restart: unless-stopped
    ports:
      - "${CODEAWARE_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Ollama — 本地 Embedding 模型 (bge-m3)
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ${CODEAWARE_OLLAMA_CONTAINER_NAME:-ai-center-ollama}
    restart: unless-stopped
    ports:
      - "${CODEAWARE_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============================================================
  # Celery Worker — 异步任务队列
  # ============================================================
  celery_worker:
    build:
      context: ./docker
      dockerfile: Dockerfile.worker
    container_name: ${CODEAWARE_CELERY_WORKER_CONTAINER_NAME:-ai-center-celery-worker}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6380
      LLM_API_KEY: ${LLM_API_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./codeaware-py:/app
    working_dir: /app
    command: >
      celery -A app.ai.celery_app worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=50
    restart: unless-stopped

  # ============================================================
  # Flower — Celery 监控面板
  # ============================================================
  flower:
    image: mher/flower:2.0
    container_name: ${CODEAWARE_FLOWER_CONTAINER_NAME:-ai-center-flower}
    depends_on:
      - celery_worker
    environment:
      CELERY_BROKER_URL: redis://redis:6380/0
      CELERY_RESULT_BACKEND: redis://redis:6380/0
    ports:
      - "${CODEAWARE_FLOWER_HOST_PORT:-5555}:5555"
    restart: unless-stopped

  # ============================================================
  # Kafka — 事件流（Kraft 模式，单节点）
  # ============================================================
  kafka:
    image: bitnami/kafka:3.9
    container_name: ${CODEAWARE_KAFKA_CONTAINER_NAME:-ai-center-kafka}
    ports:
      - "${CODEAWARE_KAFKA_HOST_PORT:-9093}:9093"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@localhost:9091"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9091,EXTERNAL://0.0.0.0:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================
  # Kafka Consumer — 事件消费者
  # ============================================================
  kafka_consumer:
    build:
      context: ./docker
      dockerfile: Dockerfile.worker
    container_name: ${CODEAWARE_KAFKA_CONSUMER_CONTAINER_NAME:-ai-center-kafka-consumer}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./codeaware-py:/app
    working_dir: /app
    command: python -m app.ai.events.consumer
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollamadata:
  kafkadata:
